window.COURSE_DATA=[{"title": "Graphs of Quadratic Functions", "subtitle": "Rockets, vertices, intercepts, domain and range", "source": 1, "lessons": [{"title": "Rocket models", "intro": "The worksheet begins by comparing two rocket paths. Rocket 1 uses h(t) = −16t² + 150t + 1; Rocket 2 has a maximum of 580 feet at 6 seconds and lands at 12 seconds.", "questions": [{"prompt": "Which coefficient tells you Rocket 1 opens downward?", "options": ["−16", "150", "1", "t"], "correct": 0, "hint": "Look at the coefficient of t².", "explain": "The leading coefficient −16 is negative, so the parabola opens downward."}, {"prompt": "What is the time coordinate of Rocket 1’s vertex?", "options": ["4.6875 s", "9.375 s", "150 s", "16 s"], "correct": 0, "hint": "Use −b/(2a).", "explain": "−150/(2·−16)=4.6875 seconds."}, {"prompt": "Rocket 1 reaches approximately what maximum height?", "options": ["352.56 ft", "580 ft", "150 ft", "9.38 ft"], "correct": 0, "hint": "Substitute t=4.6875 into the model.", "explain": "h(4.6875)=352.5625 feet."}, {"prompt": "Which rocket flew higher?", "options": ["Rocket 1", "Rocket 2", "They tied", "Cannot compare"], "correct": 1, "hint": "Compare maximum heights: 352.56 and 580.", "explain": "Rocket 2 reaches 580 ft, higher than Rocket 1’s 352.56 ft."}, {"prompt": "Which is the vertex of Rocket 2?", "options": ["(6, 580)", "(580, 6)", "(12, 0)", "(0, 580)"], "correct": 0, "hint": "The horizontal coordinate is time.", "explain": "The maximum height of 580 ft occurs at t=6 s."}, {"prompt": "Which is the exact vertex-form model for Rocket 2?", "options": ["h(t)=−(145/9)(t−6)²+580", "h(t)=+(145/9)(t−6)²+580", "h(t)=−16(t−12)²+580", "h(t)=−(145/9)(t+6)²+580"], "correct": 0, "hint": "Use h=a(t−6)²+580 and h(0)=0.", "explain": "0=36a+580, so a=−580/36=−145/9."}]}, {"title": "Graph features", "intro": "Use the quadratic’s shape and algebra to identify key features.", "questions": [{"prompt": "For f(x)=2(x−3)²+4, what is the vertex?", "options": ["(3,4)", "(−3,4)", "(2,4)", "(3,−4)"], "correct": 0, "hint": "Vertex form is a(x−h)²+k.", "explain": "The vertex is (h,k)=(3,4)."}, {"prompt": "What is its axis of symmetry?", "options": ["x=3", "y=3", "x=4", "x=−3"], "correct": 0, "hint": "The axis passes vertically through the vertex.", "explain": "A vertex at x=3 gives the vertical line x=3."}, {"prompt": "Does f(x)=2(x−3)²+4 have a maximum or minimum?", "options": ["Maximum", "Minimum", "Neither", "Both"], "correct": 1, "hint": "Check the sign of a.", "explain": "a=2>0, so the parabola opens upward and has a minimum."}, {"prompt": "What is its y-intercept?", "options": ["(0,22)", "(22,0)", "(0,4)", "(3,4)"], "correct": 0, "hint": "Set x=0.", "explain": "f(0)=2(−3)²+4=22, giving (0,22)."}, {"prompt": "For f(x)=x²−9, what are its x-intercepts?", "options": ["(−3,0) and (3,0)", "(0,−3) and (0,3)", "(0,−9)", "(9,0)"], "correct": 0, "hint": "Set y=0 and solve x²=9.", "explain": "x=±3, and points on the x-axis have y=0."}, {"prompt": "What is the domain of f(x)=x²−9?", "options": ["All real numbers", "[−3,3]", "y≥−9", "x≥0"], "correct": 0, "hint": "Any real x can be squared.", "explain": "A quadratic polynomial is defined for every real x."}, {"prompt": "What is the range of f(x)=x²−9?", "options": ["y≥−9", "y≤−9", "All real numbers", "−3≤y≤3"], "correct": 0, "hint": "The vertex is the lowest point.", "explain": "The minimum is −9, so y≥−9."}, {"prompt": "What is the range of f(x)=−(x−2)²+5?", "options": ["y≤5", "y≥5", "x≤2", "All real numbers"], "correct": 0, "hint": "The negative sign makes the vertex a maximum.", "explain": "The highest output is 5, so y≤5."}]}]}, {"title": "Solving Quadratic Equations", "subtitle": "Factoring, square roots, completing the square, quadratic formula and discriminant", "source": 2, "lessons": [{"title": "Four solving strategies", "intro": "The worksheet asks you to solve quadratics using four strategies. These examples practice each strategy.", "questions": [{"prompt": "Solve x²−25=0.", "options": ["x=±5", "x=25", "x=−25", "x=5 only"], "correct": 0, "hint": "Add 25, then take both square roots.", "explain": "x²=25 means x=5 or −5."}, {"prompt": "Factor x²+5x+6.", "options": ["(x+2)(x+3)", "(x+1)(x+6)", "(x−2)(x−3)", "(x+5)(x+1)"], "correct": 0, "hint": "Find numbers adding to 5 and multiplying to 6.", "explain": "2+3=5 and 2·3=6."}, {"prompt": "Solve x²+5x+6=0.", "options": ["−2 and −3", "2 and 3", "−1 and −6", "0 and 6"], "correct": 0, "hint": "Set each factor equal to zero.", "explain": "(x+2)(x+3)=0, so x=−2 or −3."}, {"prompt": "To complete the square for x²+6x, add:", "options": ["9", "6", "3", "36"], "correct": 0, "hint": "Use (b/2)².", "explain": "(6/2)²=9, giving (x+3)²."}, {"prompt": "Solve (x−4)²=16.", "options": ["0 and 8", "4 and 16", "−4 and 4", "8 only"], "correct": 0, "hint": "Take positive and negative square roots.", "explain": "x−4=±4, so x=0 or 8."}, {"prompt": "Which is the quadratic formula?", "options": ["x=(−b±√(b²−4ac))/(2a)", "x=(b±√(b²+4ac))/(2a)", "x=−b/(2a)", "x=a(x−h)²+k"], "correct": 0, "hint": "It includes a square root and ±.", "explain": "The quadratic formula solves ax²+bx+c=0 when a≠0."}, {"prompt": "For x²−4x−5=0, what are the solutions?", "options": ["5 and −1", "−5 and 1", "4 and 5", "−4 and −5"], "correct": 0, "hint": "Factor into (x−5)(x+1).", "explain": "The roots are x=5 and x=−1."}]}, {"title": "The discriminant", "intro": "The worksheet connects the discriminant to the number of real x-intercepts.", "questions": [{"prompt": "Which expression is the discriminant?", "options": ["b²−4ac", "−b/(2a)", "a²+b²", "4ac−b"], "correct": 0, "hint": "It is under the square root in the quadratic formula.", "explain": "The discriminant is Δ=b²−4ac."}, {"prompt": "For x²−4x+4=0, what is Δ?", "options": ["0", "16", "−16", "4"], "correct": 0, "hint": "a=1,b=−4,c=4.", "explain": "Δ=(−4)²−4·1·4=0."}, {"prompt": "When Δ>0, how many distinct real solutions are there?", "options": ["2", "1", "0", "Infinitely many"], "correct": 0, "hint": "A positive number has two real square-root signs.", "explain": "Δ>0 gives two distinct real roots."}, {"prompt": "When Δ=0, how many distinct real solutions are there?", "options": ["1", "2", "0", "3"], "correct": 0, "hint": "The ± square-root term is zero.", "explain": "Both formula branches coincide in one repeated real root."}, {"prompt": "When Δ<0, how many real solutions are there?", "options": ["0", "1", "2", "Infinitely many"], "correct": 0, "hint": "A negative number has no real square root.", "explain": "There are no real roots; complex roots occur instead."}, {"prompt": "What do real roots correspond to on the graph?", "options": ["x-intercepts", "y-intercepts", "axis of symmetry", "maximum height"], "correct": 0, "hint": "At a root, y=0.", "explain": "Real roots are where the parabola crosses or touches the x-axis."}]}]}, {"title": "Quadratic Transformations", "subtitle": "Translations, reflections, stretches and range", "source": 3, "lessons": [{"title": "Moving the parent graph", "intro": "The worksheet compares transformations of the parent function f(x)=x².", "questions": [{"prompt": "Compared with y=x², y=x²+2 shifts:", "options": ["Up 2", "Down 2", "Left 2", "Right 2"], "correct": 0, "hint": "The constant is outside the square.", "explain": "Adding 2 to all outputs shifts the graph up 2."}, {"prompt": "Compared with y=x², y=x²−3 shifts:", "options": ["Down 3", "Up 3", "Right 3", "Left 3"], "correct": 0, "hint": "Subtracting from y lowers all points.", "explain": "The graph shifts down 3."}, {"prompt": "Compared with y=x², y=(x+1)² shifts:", "options": ["Left 1", "Right 1", "Up 1", "Down 1"], "correct": 0, "hint": "Inside parentheses, the direction reverses.", "explain": "x+1=x−(−1), so the vertex moves left 1."}, {"prompt": "Compared with y=x², y=(x−4)² shifts:", "options": ["Right 4", "Left 4", "Up 4", "Down 4"], "correct": 0, "hint": "The vertex occurs at x=4.", "explain": "The graph shifts right 4."}, {"prompt": "What does y=2x² do to y=x²?", "options": ["Vertical stretch by 2", "Vertical shrink by 2", "Shift up 2", "Shift left 2"], "correct": 0, "hint": "Every output is multiplied by 2.", "explain": "It becomes narrower: vertical stretch factor 2."}, {"prompt": "What does y=−x² do?", "options": ["Reflect across x-axis", "Shift down 1", "Shift left 1", "Reflect across y-axis only"], "correct": 0, "hint": "The output changes sign.", "explain": "Multiplying by −1 reflects across the x-axis."}]}, {"title": "Combining transformations", "intro": "Read the vertex and shape from y=a(x−h)²+k.", "questions": [{"prompt": "What is the vertex of y=−2(x+3)²+5?", "options": ["(−3,5)", "(3,5)", "(−3,−5)", "(2,5)"], "correct": 0, "hint": "x+3=x−(−3).", "explain": "The vertex is (−3,5)."}, {"prompt": "Does y=−2(x+3)²+5 open up or down?", "options": ["Down", "Up", "Neither", "Sideways"], "correct": 0, "hint": "The leading factor is negative.", "explain": "−2 reflects the graph downward."}, {"prompt": "Which describes y=(x−2)²−7?", "options": ["Right 2, down 7", "Left 2, up 7", "Right 7, down 2", "Left 7, up 2"], "correct": 0, "hint": "Use h=2 and k=−7.", "explain": "The vertex moves from (0,0) to (2,−7)."}, {"prompt": "What is the range of y=(x−2)²−7?", "options": ["y≥−7", "y≤−7", "x≥2", "All real numbers"], "correct": 0, "hint": "The parabola opens upward.", "explain": "Its minimum y-value is −7."}, {"prompt": "What is the domain of y=−2(x+3)²+5?", "options": ["All real numbers", "x≥−3", "y≤5", "x≤5"], "correct": 0, "hint": "There are no restrictions on real x.", "explain": "All quadratic polynomials accept any real x."}, {"prompt": "Which equation has vertex (4,−2) and opens upward?", "options": ["y=(x−4)²−2", "y=−(x−4)²−2", "y=(x+4)²−2", "y=(x−2)²+4"], "correct": 0, "hint": "Use y=a(x−h)²+k with a positive.", "explain": "h=4,k=−2 and a=1."}]}]}, {"title": "Operations with Complex Numbers", "subtitle": "The imaginary unit, addition, multiplication and conjugates", "source": 4, "lessons": [{"title": "Imaginary unit and arithmetic", "intro": "The worksheet practices simplifying expressions involving complex numbers.", "questions": [{"prompt": "What does i² equal?", "options": ["−1", "1", "i", "−i"], "correct": 0, "hint": "This is the defining property of i.", "explain": "i=√−1, so i²=−1."}, {"prompt": "Simplify √−16.", "options": ["4i", "−4", "16i", "4"], "correct": 0, "hint": "√−16=√16·√−1.", "explain": "√−16=4i."}, {"prompt": "Simplify (3+2i)+(5−7i).", "options": ["8−5i", "8+9i", "−2−5i", "15−14i"], "correct": 0, "hint": "Combine real parts and imaginary parts separately.", "explain": "3+5=8 and 2i−7i=−5i."}, {"prompt": "Simplify (6+4i)−(2+9i).", "options": ["4−5i", "4+13i", "8+13i", "−4+5i"], "correct": 0, "hint": "Distribute the minus sign first.", "explain": "6−2=4; 4i−9i=−5i."}, {"prompt": "Simplify 3i·4i.", "options": ["−12", "12", "12i", "−12i"], "correct": 0, "hint": "Multiply coefficients, then use i²=−1.", "explain": "12i²=−12."}, {"prompt": "Simplify i³.", "options": ["−i", "i", "−1", "1"], "correct": 0, "hint": "i³=i²·i.", "explain": "i³=(−1)i=−i."}, {"prompt": "Simplify i⁴.", "options": ["1", "−1", "i", "−i"], "correct": 0, "hint": "Square i².", "explain": "i⁴=(i²)²=(−1)²=1."}]}, {"title": "Products and conjugates", "intro": "Use distribution and collect like terms.", "questions": [{"prompt": "Expand (2+i)(3+i).", "options": ["5+5i", "6+5i", "5+i", "6−i"], "correct": 0, "hint": "FOIL and replace i² with −1.", "explain": "6+2i+3i+i²=5+5i."}, {"prompt": "Simplify (1+2i)(1−2i).", "options": ["5", "−3", "1−4i", "1+4i"], "correct": 0, "hint": "Conjugate products eliminate the imaginary terms.", "explain": "1−(2i)²=1−(−4)=5."}, {"prompt": "What is the conjugate of 4−7i?", "options": ["4+7i", "−4+7i", "−4−7i", "7−4i"], "correct": 0, "hint": "Keep the real part and reverse the sign of i.", "explain": "The conjugate is 4+7i."}, {"prompt": "Simplify (3+2i)(3−2i).", "options": ["13", "5", "9+4i", "9−4i"], "correct": 0, "hint": "Use a²+b² for a conjugate product.", "explain": "3²+2²=13, a real number."}, {"prompt": "Simplify −48−14i into real and imaginary parts.", "options": ["Real −48, imaginary −14", "Real −14, imaginary −48", "Real 48, imaginary 14", "Real −48, imaginary 14"], "correct": 0, "hint": "Read a+bi: a is real and b is imaginary coefficient.", "explain": "a=−48 and b=−14."}]}]}, {"title": "Quadratic Equations with Complex Roots", "subtitle": "Non-real solutions, discriminants and conjugate pairs", "source": 5, "lessons": [{"title": "Solving with complex roots", "intro": "The worksheet asks for algebraic solutions and how graphs support them.", "questions": [{"prompt": "Solve x²+9=0.", "options": ["x=±3i", "x=±3", "x=−9", "No complex solutions"], "correct": 0, "hint": "Move 9, then use √−9=3i.", "explain": "x²=−9, so x=±3i."}, {"prompt": "What does x²+9 look like on the real coordinate plane?", "options": ["No x-intercepts", "Two x-intercepts", "One x-intercept", "A line"], "correct": 0, "hint": "x²+9 is always at least 9.", "explain": "There are no real x-intercepts, consistent with non-real roots."}, {"prompt": "Solve x²−4x+13=0.", "options": ["2±3i", "−2±3i", "2±9i", "4±3i"], "correct": 0, "hint": "Δ=16−52=−36.", "explain": "x=(4±√−36)/2=2±3i."}, {"prompt": "For x²+bx+c=0, what does a negative discriminant mean?", "options": ["Two non-real complex roots", "Two real roots", "One real root", "Infinitely many roots"], "correct": 0, "hint": "Look at the sign under the square root.", "explain": "Δ<0 means a non-real conjugate pair."}, {"prompt": "Which is the conjugate pair?", "options": ["5+2i and 5−2i", "5+2i and −5+2i", "5+2i and 2+5i", "5+2i and −5−2i"], "correct": 0, "hint": "Same real part, opposite imaginary sign.", "explain": "The conjugate of 5+2i is 5−2i."}]}, {"title": "Choosing c and proving a property", "intro": "The worksheet asks for values of c that give two real, two non-real or one repeated real solution, and for a conjugate-product proof.", "questions": [{"prompt": "For x²+4x+c=0, what c gives exactly one repeated real root?", "options": ["4", "0", "5", "−4"], "correct": 0, "hint": "Set Δ=16−4c equal to zero.", "explain": "16−4c=0 gives c=4."}, {"prompt": "For x²+4x+c=0, which c gives two distinct real roots?", "options": ["3", "4", "5", "9"], "correct": 0, "hint": "Need 16−4c>0.", "explain": "c=3 gives Δ=4>0."}, {"prompt": "For x²+4x+c=0, which c gives two non-real roots?", "options": ["5", "4", "3", "0"], "correct": 0, "hint": "Need 16−4c<0.", "explain": "c=5 gives Δ=−4<0."}, {"prompt": "What is (a+bi)(a−bi) for real a,b?", "options": ["a²+b²", "a²−b²", "a²+2abi+b²", "a²−2abi−b²"], "correct": 0, "hint": "Expand and use i²=−1.", "explain": "a²−(bi)²=a²+b², which is real."}, {"prompt": "What is the product (2+3i)(2−3i)?", "options": ["13", "−5", "4−9i", "4+9i"], "correct": 0, "hint": "Apply a²+b².", "explain": "2²+3²=4+9=13."}]}]}, {"title": "Graphing Quadratic Inequalities", "subtitle": "Boundary curves, shading, solid/dashed lines and systems", "source": 6, "lessons": [{"title": "Graphing inequalities", "intro": "The worksheet asks you to sketch each inequality and name a solution.", "questions": [{"prompt": "For y>x², where do you shade?", "options": ["Above the parabola", "Below the parabola", "Only on the parabola", "Left of y-axis"], "correct": 0, "hint": "Greater y-values lie above the curve.", "explain": "Shade the region above y=x²."}, {"prompt": "For y<x², which boundary style?", "options": ["Dashed", "Solid", "No boundary", "Vertical line"], "correct": 0, "hint": "Strict inequality excludes equality.", "explain": "Dashed indicates points on y=x² are not included."}, {"prompt": "For y≤x²−1, which boundary style?", "options": ["Solid", "Dashed", "Dotted only", "No boundary"], "correct": 0, "hint": "The equals sign includes the boundary.", "explain": "Solid curve because y=x²−1 is included."}, {"prompt": "Does (0,2) satisfy y>x²?", "options": ["Yes", "No", "Only if x>0", "Only if y=0"], "correct": 0, "hint": "Substitute x=0,y=2.", "explain": "2>0²=0, so yes."}, {"prompt": "Does (2,1) satisfy y≥x²?", "options": ["No", "Yes", "Only on the boundary", "Cannot tell"], "correct": 0, "hint": "Compare 1 with 2²=4.", "explain": "1≥4 is false."}, {"prompt": "For y≥−x²+4, shade:", "options": ["Above the parabola", "Below the parabola", "Right only", "Left only"], "correct": 0, "hint": "≥ means y is larger than or equal to the curve.", "explain": "Shade above and include the boundary."}]}, {"title": "Systems and checking points", "intro": "A solution to a system must satisfy every inequality.", "questions": [{"prompt": "Does (0,1) satisfy both y≥x² and y≤2?", "options": ["Yes", "No, first fails", "No, second fails", "Neither can be checked"], "correct": 0, "hint": "At x=0, check 1≥0 and 1≤2.", "explain": "Both statements are true."}, {"prompt": "Does (2,1) satisfy both y≥x² and y≤2?", "options": ["No", "Yes", "Only the first", "Both fail"], "correct": 0, "hint": "At x=2, x²=4.", "explain": "1≥4 is false, so the point is not in the intersection."}, {"prompt": "What represents the solution set of a system of inequalities?", "options": ["The overlapping shaded region", "The union of every shaded region", "Only the y-axis", "Only x-intercepts"], "correct": 0, "hint": "A point must satisfy all conditions.", "explain": "The intersection of the shaded regions is the system solution."}, {"prompt": "Does (1,1) lie on the boundary y=x²?", "options": ["Yes", "No", "Only if x=0", "Only if y=0"], "correct": 0, "hint": "Substitute x=1 and y=1.", "explain": "1=1², so it lies on the boundary."}, {"prompt": "If the inequality is y>x², is (1,1) a solution?", "options": ["No", "Yes", "Only if dashed", "Cannot determine"], "correct": 0, "hint": "Strict > excludes equality.", "explain": "1>1 is false; the boundary point is excluded."}, {"prompt": "What type of solution does a quadratic inequality usually describe?", "options": ["A region of points", "A single number only", "A single ordered pair only", "Always no solutions"], "correct": 0, "hint": "Think about (()=>{'use strict';const data=window.COURSE_DATA;const KEY='quadratic-lab-progress-v1';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let page={view:'home'},chosen=null,revealed=false,hint=false;const $=s=>document.querySelector(s);const app=$('#app');const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>escape(s).replace(/\n/g,'<br>');const unitQuestions=u=>data[u].lessons.reduce((a,l)=>a+l.questions.length,0);const key=(u,l,q)=>`${u}:${l}:${q}`;const done=u=>data[u].lessons.reduce((n,l,li)=>n+l.questions.filter((_,qi)=>state[key(u,li,qi)]?.correct).length,0);const allCount=data.reduce((n,u)=>n+u.lessons.reduce((a,l)=>a+l.questions.length,0),0);const allDone=data.reduce((n,_,i)=>n+done(i),0);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const percent=(a,b)=>Math.round(a/b*100);function bar(a,b){return `<div class="progress" role="progressbar" aria-valuenow="${a}" aria-valuemin="0" aria-valuemax="${b}"><div class="fill" style="width:${percent(a,b)}%"></div></div>`}function graph(){return `<div class="graphwrap"><svg viewBox="0 0 430 220" role="img" aria-label="Upward opening parabola with a marked vertex and axis of symmetry"><path d="M24 180H405 M215 12V202" stroke="#8ea5ba" stroke-width="1.5" fill="none"/><path d="M80 22Q215 350 350 22" fill="none" stroke="#1687ca" stroke-width="4"/><path d="M215 12V202" stroke="#de9d3d" stroke-width="2" stroke-dasharray="6 6"/><circle cx="215" cy="186" r="5" fill="#1687ca"/><text x="230" y="172" font-size="13" fill="#28506e">vertex / minimum</text></svg><div class="small">Illustration: a positive leading coefficient gives an upward-opening parabola.</div></div>`}function home(){page={view:'home'};app.innerHTML=`<section class="hero"><div class="tag">Self-paced interactive practice</div><h1>Build confidence in Algebra 2</h1><p>Six units based on your Topic 4 worksheets. Answer one question at a time, request a hint, and read the explanation after checking. Works without an internet connection.</p></section><div class="stats"><div class="stat"><b>6</b><span>Units</span></div><div class="stat"><b>${allDone}/${allCount}</b><span>Questions mastered</span></div><div class="stat"><b>${percent(allDone,allCount)}%</b><span>Course progress</span></div></div><div class="grid">${data.map((u,i)=>`<article class="card"><div class="tag">Unit ${i+1}</div><h2>${escape(u.title)}</h2><p>${escape(u.subtitle)}</p>${bar(done(i),unitQuestions(i))}<div class="meta"><span>${done(i)} of ${unitQuestions(i)} mastered</span><span>${u.lessons.length} lessons</span></div><button class="primary" data-unit="${i}">${done(i)?'Continue unit':'Start unit'}</button></article>`).join('')}</div><div class="panel"><h2>Worksheet reference library</h2><p class="small">The original worksheet PDFs are available separately. Interactive questions are worksheet-aligned practice, not a transcription of every worksheet problem.</p><div class="actions"><button class="secondary" id="reset">Reset progress</button><button class="secondary" id="export">Export progress</button><label class="secondary" style="cursor:pointer">Import progress <input type="file" id="import" accept="application/json,.json" hidden></label></div></div><footer class="footer">Your progress is stored locally in this browser on this device. It is not uploaded or shared. Offline learning materials are provided for practice; consult your worksheet and teacher for official assignments.</footer>`;app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>unit(+b.dataset.unit));$('#reset').onclick=()=>{if(confirm('Clear all saved progress on this device?')){state={};save();home()}};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Quadratic Lab',version:1,progress:state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quadratic-lab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='Quadratic Lab'||typeof obj.progress!=='object'||Array.isArray(obj.progress)||!obj.progress)throw Error();state=obj.progress;save();home()}catch{alert('This is not a valid Quadratic Lab progress file.')}}}
function unit(u){page={view:'unit',u};let d=data[u];app.innerHTML=`<div class="toolbar"><button class="secondary" id="back">← All units</button></div><div class="hero"><div class="tag">Unit ${u+1}</div><h1>${escape(d.title)}</h1><p>${escape(d.subtitle)}</p>${bar(done(u),unitQuestions(u))}<p class="small">${done(u)} of ${unitQuestions(u)} questions mastered</p></div><h2>Lessons</h2>${d.lessons.map((l,i)=>{let count=l.questions.filter((_,q)=>state[key(u,i,q)]?.correct).length;return `<div class="lesson"><div><b>${i+1}. ${escape(l.title)}</b><p>${escape(l.intro)}</p><p>${count}/${l.questions.length} mastered</p></div><button class="primary" data-lesson="${i}">${count===l.questions.length?'Review':'Study lesson'}</button></div>`}).join('')}`;$('#back').onclick=home;app.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{let l=+b.dataset.lesson;let q=d.lessons[l].questions.findIndex((_,i)=>!state[key(u,l,i)]?.correct);question(u,l,q<0?0:q)})}
function question(u,l,q){page={view:'question',u,l,q};chosen=null;revealed=false;hint=false;renderQuestion()}function renderQuestion(){let {u,l,q}=page,d=data[u],lesson=d.lessons[l],item=lesson.questions[q],entry=state[key(u,l,q)];app.innerHTML=`<div class="toolbar row"><button class="secondary" id="back">← Lessons</button><span class="crumb">Unit ${u+1} / Lesson ${l+1} / Question ${q+1} of ${lesson.questions.length}</span></div><div class="panel"><div class="row space"><span class="pill">${escape(lesson.title)}</span><span class="kicker">${q+1} / ${lesson.questions.length}</span></div>${bar(q+1,lesson.questions.length)}<p class="small">${escape(lesson.intro)}</p>${u===0&&l===1&&q===0?graph():''}<div class="question">${safe(item.prompt)}</div><div class="options" role="group" aria-label="Answer choices">${item.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''} ${revealed&&i===item.correct?'correct':''} ${revealed&&chosen===i&&i!==item.correct?'wrong':''}" data-choice="${i}" ${revealed?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span class="math">${safe(o)}</span></button>`).join('')}</div>${hint&&!revealed?`<div class="hint"><b>Hint:</b> ${safe(item.hint)}</div>`:''}${revealed?`<div class="feedback ${chosen===item.correct?'ok':'no'}" aria-live="polite"><b>${chosen===item.correct?'✓ Correct!':'Not quite — let’s work through it.'}</b><div>${safe(item.explain)}</div>${chosen!==item.correct?`<div><b>Correct choice:</b> ${'ABCD'[item.correct]}. ${safe(item.options[item.correct])}</div>`:''}</div>`:''}<div class="actions">${!revealed?`<button class="secondary" id="hint">${hint?'Hide hint':'Show hint'}</button><button class="primary" id="check" ${chosen===null?'disabled':''}>Check my answer</button>`:`<button class="primary" id="next">${q+1===lesson.questions.length?'Finish lesson':'Next question →'}</button><button class="secondary" id="retry">Try again</button>`}</div>${entry?.correct?'<p class="small success">✓ Previously mastered</p>':''}</div>`;$('#back').onclick=()=>unit(u);if(!revealed){app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen=+b.dataset.choice;renderQuestion()});$('#hint').onclick=()=>{hint=!hint;renderQuestion()};$('#check').onclick=()=>{revealed=true;let k=key(u,l,q);let old=state[k]||{};state[k]={correct:old.correct||chosen===item.correct,attempts:(old.attempts||0)+1};save();renderQuestion()}}else{$('#next').onclick=()=>q+1<lesson.questions.length?question(u,l,q+1):finish(u,l);$('#retry').onclick=()=>question(u,l,q)}}
function finish(u,l){page={view:'finish',u,l};let lesson=data[u].lessons[l],n=lesson.questions.filter((_,q)=>state[key(u,l,q)]?.correct).length;app.innerHTML=`<div class="panel"><div class="tag">Lesson complete</div><h1>${escape(lesson.title)}</h1><p>You have mastered <b>${n} of ${lesson.questions.length}</b> questions in this lesson.</p>${bar(n,lesson.questions.length)}<p class="small">You can revisit any question. An incorrect answer is followed by an explanation, and a later correct attempt counts as mastered.</p><div class="actions"><button class="primary" id="continue">${l+1<data[u].lessons.length?'Next lesson':'Back to unit'}</button><button class="secondary" id="review">Review lesson</button><button class="secondary" id="home">All units</button></div></div>`;$('#continue').onclick=()=>l+1<data[u].lessons.length?question(u,l+1,0):unit(u);$('#review').onclick=()=>question(u,l,0);$('#home').onclick=home}
$('#homeBtn').onclick=home;home()})();
</script></body></html>
